<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | Jomar T. Bendillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --maple: #dba96a;
  --maple-dark: #c48d4c;
  --paint: #16306e;
  --paint-deep: #0f2252;
  --ball: #ea5a1a;
  --chalk: #fff8ec;
  --ink: #1b130d;
  --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--body);
  font-size: 1.0625rem;
  line-height: 1.65;
  color: var(--ink);
  background-color: var(--maple);
  background-image:
    repeating-linear-gradient(90deg, transparent 0 118px, rgba(120, 70, 25, 0.22) 118px 120px),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.07) 0 60px, rgba(0, 0, 0, 0.04) 60px 120px);
}

img { max-width: 100%; display: block; }

a { color: inherit; }

a:focus-visible, button:focus-visible {
  outline: 3px solid var(--ball);
  outline-offset: 3px;
}

.nav {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.75rem clamp(1rem, 4vw, 3rem);
  background: var(--paint-deep);
  color: var(--chalk);
  border-bottom: 4px solid var(--ball);
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.4rem;
  letter-spacing: 0.04em;
  text-decoration: none;
}

.brand img { width: 30px; height: 30px; transition: transform 0.6s ease; }
.brand:hover img { transform: rotate(360deg); }

.nav ul {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.nav a.link {
  display: block;
  padding: 0.35rem 0.9rem;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.95rem;
  text-decoration: none;
  transition: background 0.2s ease, color 0.2s ease;
}

.nav a.link:hover { background: rgba(255, 248, 236, 0.15); }
.nav a.link[aria-current="page"] { background: var(--ball); color: var(--chalk); }

.btn {
  display: inline-block;
  padding: 0.85rem 1.7rem;
  border: 3px solid var(--paint-deep);
  border-radius: 999px;
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.25rem;
  letter-spacing: 0.04em;
  text-decoration: none;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
}

.btn-fill { background: var(--ball); border-color: var(--ball); color: var(--chalk); }
.btn:hover { transform: translateY(-4px); box-shadow: 0 8px 0 rgba(15, 34, 82, 0.35); }
.btn:active { transform: translateY(0); box-shadow: none; }

h1, h2 {
  margin: 0;
  font-family: var(--display);
  font-weight: 900;
  text-transform: uppercase;
  line-height: 0.9;
}

.top {
  position: relative;
  overflow: hidden;
  padding: clamp(3rem, 8vw, 6rem) clamp(1rem, 6vw, 5rem) clamp(2rem, 5vw, 3rem);
}

.top-inner { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; }

.top h1 {
  font-size: clamp(3.4rem, 12vw, 9rem);
  color: var(--paint-deep);
  animation: tipoff 0.8s cubic-bezier(0.2, 0.9, 0.25, 1) both;
}

.top p {
  max-width: 44ch;
  margin: 1.25rem 0 0;
  font-size: 1.2rem;
  font-weight: 500;
}

@keyframes tipoff {
  from { opacity: 0; transform: translateY(-50px) scale(1.05); }
  to { opacity: 1; transform: none; }
}

.wall {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-auto-rows: 130px;
  gap: 1.25rem;
  max-width: 1100px;
  margin: 0 auto;
  padding: 1rem clamp(1rem, 6vw, 5rem) clamp(3rem, 8vw, 5rem);
}

.shot {
  position: relative;
  display: block;
  overflow: hidden;
  border: 6px solid var(--chalk);
  border-radius: 14px;
  background: var(--paint);
  box-shadow: 10px 10px 0 rgba(15, 34, 82, 0.55);
  text-decoration: none;
  color: var(--chalk);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.shot:hover {
  transform: translate(-4px, -6px) rotate(-1deg);
  box-shadow: 16px 18px 0 rgba(15, 34, 82, 0.55);
}

.shot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
}

.shot:hover img { transform: scale(1.07); }

.shot figcaption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 1.5rem 1rem 0.8rem;
  background: linear-gradient(180deg, transparent, rgba(15, 34, 82, 0.92));
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.5rem;
  text-transform: uppercase;
  transform: translateY(100%);
  transition: transform 0.3s ease;
}

.shot:hover figcaption, .shot:focus-visible figcaption { transform: translateY(0); }

.shot-sunset { grid-column: 1 / 4; grid-row: 1 / 4; }
.shot-portrait { grid-column: 4 / 7; grid-row: 1 / 7; }
.shot-jersey { grid-column: 1 / 4; grid-row: 4 / 7; }
.shot-river { grid-column: 1 / 3; grid-row: 7 / 10; }
.shot-pool { grid-column: 3 / 5; grid-row: 7 / 10; }
.shot-beach { grid-column: 5 / 7; grid-row: 7 / 10; }

.shot-sunset img { object-position: 50% 60%; }
.shot-portrait img { object-position: 50% 45%; }
.shot-jersey img { object-position: 50% 80%; }
.shot-river img { object-position: 70% 50%; }
.shot-pool img { object-position: 55% 60%; }
.shot-beach img { object-position: 50% 50%; }

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background: rgba(15, 34, 82, 0.94);
}

.lightbox:target { display: flex; animation: pop 0.25s ease both; }

.lightbox figure {
  position: relative;
  z-index: 2;
  margin: 0;
  max-width: min(92vw, 900px);
  color: var(--chalk);
  text-align: center;
}

.lightbox img {
  max-height: 80vh;
  width: auto;
  margin: 0 auto;
  border: 6px solid var(--chalk);
  border-radius: 14px;
}

.lightbox figcaption {
  margin-top: 0.75rem;
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.6rem;
  text-transform: uppercase;
}

.lightbox .backdrop { position: absolute; inset: 0; z-index: 1; cursor: zoom-out; }

.lightbox .close {
  position: absolute;
  top: 1rem;
  right: 1rem;
  z-index: 3;
  padding: 0.5rem 1.2rem;
  border-radius: 999px;
  background: var(--ball);
  color: var(--chalk);
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.2rem;
  text-decoration: none;
}

@keyframes pop {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: none; }
}

.next {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
  padding: clamp(2.5rem, 6vw, 4rem) clamp(1rem, 6vw, 5rem);
  background: var(--paint-deep);
  color: var(--chalk);
  border-top: 6px solid var(--ball);
}

.next h2 { font-size: clamp(2rem, 5vw, 3.4rem); max-width: 16ch; }

.footer {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 1.25rem clamp(1rem, 4vw, 3rem);
  background: var(--ink);
  color: var(--chalk);
  font-size: 0.95rem;
}

@media (max-width: 820px) {
  .wall { grid-template-columns: 1fr; grid-auto-rows: auto; }
  .shot { grid-column: auto !important; grid-row: auto !important; aspect-ratio: 4 / 5; }
  .shot figcaption { transform: translateY(0); }
  .nav { flex-direction: column; align-items: flex-start; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
